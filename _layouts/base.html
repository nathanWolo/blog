<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.author | default: site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <meta property="og:title" content="{{ page.title | default: site.author | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <meta name="color-scheme" content="light dark">

    <!-- Apply a saved light/dark choice before the page paints. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">

    {% if page.layout != 'home' %}
    <!-- LaTeX support on posts and pages. -->
    <script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML"></script>
    {% endif %}

    {% include head-custom.html %}
  </head>
  <body>
    <button class="theme-toggle" type="button" aria-label="Switch between light and dark theme" title="Light / dark"></button>

    {{ content }}

    <footer class="site-footer" aria-hidden="true"><span></span><span></span></footer>

    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
